[project]
name = "soma0sd-rpi-schedule"
version = "0.4.0"
description = "Windows PC 시스템 지표와 구글 캘린더 일정을 표시하는 Raspberry Pi 웹 키오스크"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "psutil>=6.1",
    "rich>=13.0",
    # Windows에는 시스템 tzdb가 없어 zoneinfo가 실패. RPi는 정상이라 마커로 분기.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
soma0sd-rpi-schedule = "soma0sd_rpi_schedule.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
