<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<!-- chromium 번역 풍선 차단: HTML notranslate + google meta. 정책·Preferences 와 함께 다층 방어. -->
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ko">
<title>soma0sd_RPi_Schedule</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="notranslate">
<div id="banner" class="banner" hidden></div>
<main id="root">
  <section id="left" class="pane">
    <div id="event-list" class="event-list"></div>
  </section>
  <section id="right" class="pane">
    <div id="month-header">
      <button id="prev" class="nav" aria-label="이전 달">‹</button>
      <h2 id="month-title">…</h2>
      <button id="next" class="nav" aria-label="다음 달">›</button>
    </div>
    <div id="weekdays">
      <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
    </div>
    <div id="month-grid"></div>
  </section>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
