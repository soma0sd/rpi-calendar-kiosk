[package]
name = "soma0sd-rpi-schedule-rust"
version = "0.4.0"
edition = "2024"
description = "Rust runtime for the Raspberry Pi calendar kiosk and Windows host monitor"
license = "MIT"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "rpi-schedule-kiosk"
path = "rust/src/bin/kiosk.rs"

[[bin]]
name = "rpi-schedule-monitor"
path = "rust/src/bin/monitor.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
